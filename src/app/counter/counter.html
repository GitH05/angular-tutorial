<div class="counter-container">
  <div class="counter-card">

    <div class="icon">🔢</div>

    <h1>Simple Counter</h1>
    <p class="subtitle">Keep track of your numbers</p>

    <div class="count-box">
      <span class="count">{{count}}</span>
    </div>

    <div class="buttons">
      <button class="btn plus" (click)="handle('plus')">
        <span>+</span>
        <small>Increase</small>
      </button>

      <button class="btn reset" (click)="handle('reset')">
        <span>↻</span>
        <small>Reset</small>
      </button>

      <button class="btn minus" (click)="handle('minus')">
        <span>−</span>
        <small>Decrease</small>
      </button>
    </div>
    <p class="footer-text">Click a button to change the counter</p>
  </div>
</div>
